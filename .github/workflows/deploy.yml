name: Build & Deploy Orchestration

on:
  push:
    branches:
      - dev
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/usevixa/vixa-ochestration-layer-service

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # dev keeps publishing the moving :latest tag exactly as before — that tag is what the
      # deploy job below pulls, so it must never be touched by a main build. main gets its own
      # immutable per-commit tag (main-<short sha>) instead, so a main publish can never
      # overwrite what dev's deploy step relies on. Unrecognised branches fail loudly rather
      # than silently falling back to a guessed tag.
      - name: Set image tag
        id: vars
        run: |
          case "${{ github.ref_name }}" in
            dev)  echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
            main) echo "tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT" ;;
            *)    echo "Unexpected branch '${{ github.ref_name }}' — refusing to guess a tag." >&2; exit 1 ;;
          esac

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # dev only. This job deploys (SSH + docker compose up) to the same DEPLOY_HOST this
    # workflow has always used, on both its main-triggered and dev-triggered eras — do not let
    # a main push reach it. main publishes an image only; production stays a hand-deploy.
    if: github.ref_name == 'dev'

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            docker compose -f /root/orchestration/orchestration-compose.yml down
            docker image prune -af
            docker pull ghcr.io/usevixa/vixa-ochestration-layer-service:latest
            docker compose -f /root/orchestration/orchestration-compose.yml up -d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
